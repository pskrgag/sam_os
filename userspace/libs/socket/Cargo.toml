[package]
name = "socket"
version = "0.1.0"
edition = "2024"

[dependencies]
bitmask = { git = "https://github.com/pskrgag/bitmask.git", default-features = false }
heapless = "0.7"
libc = { path = "../libc" }
net = { path = "../net" }
netstack-types = { path = "../netstack-types" }
postcard = { version = "1.1.3", features = ["alloc", "experimental-derive"] }
rokio = { path = "../rokio" }
rtl = { path = "../../../rtl" }
serde = { version = "1", default-features = false }
spin = "0.10.0"
zerocopy = "0.8.55"

[build-dependencies]
ridl = { path = "../../../tools/ridl" }
