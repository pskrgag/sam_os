[package]
name = "netstack"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = { path = "../../libs/libc/" }
dma = { path = "../../libs/dma/" }
net = { path = "../../libs/net/" }
netstack-types = { path = "../../libs/netstack-types/" }
rtl = { path = "../../../rtl/" }
hal = { path = "../../../hal/" }
postcard = { version = "1.1.3", features = ["alloc", "experimental-derive"] }
heapless = "0.7"
serde = { version = "1", default-features = false  }
cpio_reader = "0.1.2"
rokio = { path = "../../libs/rokio" }
downcast-rs = { version = "2.0.1", default-features = false }
bitmask = { git = "https://github.com/pskrgag/bitmask.git", default-features = false }
async-trait = "0.1.89"
adt = { path = "../../../adt" }
spin = "0.10.0"
zerocopy = "0.8.55"

[build-dependencies]
ridl = { path = "../../../tools/ridl/" }
